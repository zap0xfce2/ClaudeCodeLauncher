version: "3"

silent: true

vars:
  BUILD_DIR: /tmp/nuitka-build

tasks:
  default:
    desc: "Bauen & Installieren"
    cmds:
      - task: pre-clean
      - task: build
      - task: install
      - task: post-clean

  pre-clean:
    desc: "Bereinige vorherige Builds"
    cmds:
      - rm -rf build dist __pycache__ {{.BUILD_DIR}}
      - rm -rf ~/bin/ClaudeCodeLauncher

  build:
    desc: "Erstelle die Anwendung mit gesetzter Version"
    vars:
      BUILD_DATE:
        sh: date +%y%m%d%H%M
    cmds:
      # Entry-Point + Package mit gesetzter Version im tmp-Verzeichnis anlegen (keine Schreibzugriffe aufs Netzlaufwerk)
      - mkdir -p {{.BUILD_DIR}}
      - cp main.py {{.BUILD_DIR}}/main.py
      - cp -R claude_code_launcher {{.BUILD_DIR}}/claude_code_launcher
      - sed -i '' 's/VERSION = "vYYMMDDhhmm"/VERSION = "v{{.BUILD_DATE}}"/' {{.BUILD_DIR}}/main.py
      - uv run python -m nuitka --mode=onefile --output-dir={{.BUILD_DIR}} --output-filename=ClaudeCodeLauncher --assume-yes-for-downloads --quiet {{.BUILD_DIR}}/main.py

  install:
    desc: "Installiere das Build"
    cmds:
      - mkdir -p ~/bin
      - cp {{.BUILD_DIR}}/ClaudeCodeLauncher ~/bin/

  post-clean:
    desc: "Entfernt temporäres Build-Verzeichnis"
    cmds:
      - rm -rf {{.BUILD_DIR}}

  test:
    desc: "Führe die Tests aus"
    cmds:
      - uv run pytest

version: "3"

silent: true

vars:
  BUILD_DIR: /tmp/nuitka-build

tasks:
  default:
    desc: "Bauen & Installieren"
    cmds:
      - task: pre-clean
      - task: build
      - task: install
      - task: post-clean

  pre-clean:
    desc: "Bereinige vorherige Builds"
    cmds:
      - rm -rf {{.BUILD_DIR}}
      - rm -rf /opt/homebrew/bin/ClaudeCodeLauncher

  build:
    desc: "Erstelle die Anwendung mit gesetzter Version"
    vars:
      BUILD_DATE:
        sh: date +%y%m%d%H%M
    cmds:
      # Kopie mit gesetzter Version im tmp-Verzeichnis anlegen (keine Schreibzugriffe aufs Netzlaufwerk)
      - mkdir -p {{.BUILD_DIR}}
      - cp ClaudeCodeLauncher.py {{.BUILD_DIR}}/_ClaudeCodeLauncher_versioned.py
      - sed -i '' 's/VERSION = "vYYMMDDhhmm"/VERSION = "v{{.BUILD_DATE}}"/' {{.BUILD_DIR}}/_ClaudeCodeLauncher_versioned.py
      - uv run python -m nuitka --mode=onefile --output-dir={{.BUILD_DIR}} --output-filename=ClaudeCodeLauncher --remove-output --assume-yes-for-downloads --quiet {{.BUILD_DIR}}/_ClaudeCodeLauncher_versioned.py

  install:
    desc: "Installiere das Build"
    cmds:
      - cp {{.BUILD_DIR}}/ClaudeCodeLauncher /opt/homebrew/bin

  post-clean:
    desc: "Entfernt temporäres Build-Verzeichnis"
    cmds:
      - rm -rf {{.BUILD_DIR}}

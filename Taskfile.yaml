version: "3"

silent: true

tasks:
  default:
    desc: "Bauen & Installieren"
    cmds:
      - task: pre-clean
      - task: build
      - task: install
      - task: post-clean

  pre-clean:
    desc: "Bereinige vorherige Builds"
    cmds:
      - rm -rf build dist __pycache__
      - rm -rf /opt/homebrew/bin/ClaudeCodeLauncher

  build:
    desc: "Erstelle die Anwendung mit gesetzter Version"
    vars:
      BUILD_DATE:
        sh: date +%y%m%d%H%M
    cmds:
      # Kopie mit gesetzter Version anlegen
      - cp ClaudeCodeLauncher.py _ClaudeCodeLauncher_versioned.py
      - sed -i '' 's/VERSION = "vYYMMDDhhmm"/VERSION = "v{{.BUILD_DATE}}"/' _ClaudeCodeLauncher_versioned.py
      - uv run python -m nuitka --mode=onefile --output-dir=/tmp/nuitka-build --output-filename=ClaudeCodeLauncher --remove-output --assume-yes-for-downloads --quiet _ClaudeCodeLauncher_versioned.py

  install:
    desc: "Installiere das Build"
    cmds:
      - cp /tmp/nuitka-build/ClaudeCodeLauncher /opt/homebrew/bin

  post-clean:
    desc: "Entfernt temporäre Build-Kopien"
    cmds:
      - rm -f _ClaudeCodeLauncher_versioned.py

max_history_entries = 10
ignore_patterns = [".Plan.md.swp"]
export_ignore_patterns = [".*", "*.pyc", "__pycache__"]
import_ignore_patterns = [".git", ".env", "build", "dist"]
claude_instruction = ""
ask_for_reset = true
dont_ask_on_export_overwrite = false
plan_idle_timer_enabled = true
plan_idle_timer_duration = 10
mouse_navigation_enabled = true
respect_gitignore = false
prompt_manager_binary = "/path/to/qDrover"
prompt_manager_args = "--help"

